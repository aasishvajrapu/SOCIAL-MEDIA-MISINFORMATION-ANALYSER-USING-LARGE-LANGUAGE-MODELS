<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>Social Media Fake Post Detector</h1>

    <form method="POST">
        <textarea name="content" placeholder="Enter post here..." required></textarea>
        <button type="submit">Analyze</button>
    </form>

    {% if result %}
    <div class="result">
        <h3>Result:</h3>
        <p><strong>Type:</strong> {{ result.label }}</p>
        <p><strong>Confidence:</strong> {{ result.confidence }}%</p>
        <p><strong>Tone:</strong> {{ result.tone }}</p>
    </div>
    {% endif %}
</div>

</body>
</html>
