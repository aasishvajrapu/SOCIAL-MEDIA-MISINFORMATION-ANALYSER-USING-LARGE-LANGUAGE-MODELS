<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>📊 Dashboard</h2>

<canvas id="chart"></canvas>

<script>
new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
        labels: ['Fake', 'Real', 'Manipulative'],
        datasets: [{
            data: [30, 70, 40]
        }]
    }
});
</script>

</body>
</html>
